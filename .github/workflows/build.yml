name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'ns_signin.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NS签到助手" `
            --collect-all playwright ns_signin.py

      - name: Rename for GitHub upload
        run: |
          Copy-Item "dist/NS签到助手.exe" "dist/NS_Checkin_Assistant.exe" -Force

      - name: Extract version
        id: version
        run: |
          $v = (Select-String -Path ns_signin.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Smoke test import
        run: python -c "import ast; ast.parse(open('ns_signin.py', encoding='utf-8').read()); print('syntax ok')"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NS_Checkin_Assistant.exe
          name: NS签到助手
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Set asset display name to Chinese
        shell: pwsh
        run: |
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $releaseId = (curl -s -H "Authorization: token $token" `
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.version }}" `
            | ConvertFrom-Json).id
          $assets = curl -s -H "Authorization: token $token" `
            "https://api.github.com/repos/${{ github.repository }}/releases/$releaseId/assets" `
            | ConvertFrom-Json
          foreach ($a in $assets) {
            if ($a.name -eq "NS_Checkin_Assistant.exe") {
              curl -X PATCH -H "Authorization: token $token" `
                -H "Content-Type: application/json" `
                -d '{"label":"NS签到助手.exe"}' `
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$releaseId/assets/$($a.id)"
              Write-Host "Set label for asset $($a.id) -> NS签到助手.exe"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: NS_Checkin_Assistant-win64
          path: dist/NS_Checkin_Assistant.exe
          if-no-files-found: error
