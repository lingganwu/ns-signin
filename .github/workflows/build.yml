name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'ns_signin.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NS签到助手" `
            --collect-all playwright ns_signin.py

      - name: Rename for GitHub upload
        run: |
          Copy-Item "dist/NS签到助手.exe" "dist/NS_Checkin_Assistant.exe" -Force

      - name: Extract version
        id: version
        run: |
          $v = (Select-String -Path ns_signin.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Smoke test import
        run: python -c "import ast; ast.parse(open('ns_signin.py', encoding='utf-8').read()); print('syntax ok')"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NS_Checkin_Assistant.exe#NS签到助手.exe
          name: NS签到助手
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: NS_Checkin_Assistant-win64
          path: dist/NS_Checkin_Assistant.exe
          if-no-files-found: error
