name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'ns_signin.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NS签到助手" `
            --collect-all playwright ns_signin.py

      - name: Extract version
        id: version
        run: |
          $v = (Select-String -Path ns_signin.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Smoke test import
        run: python -c "import ast; ast.parse(open('ns_signin.py', encoding='utf-8').read()); print('syntax ok')"

      - name: Create Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release delete "v$v" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$v" "dist/NS签到助手.exe" --title "v$v" --generate-notes
          asset_id=$(gh release view "v$v" --json assets --jq '.assets[0].id')
          printf '{"name":"%s"}' "NS签到助手.exe" > asset_name.json
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --input asset_name.json

      - uses: actions/upload-artifact@v4
        with:
          name: NS签到助手-win64
          path: dist/NS签到助手.exe
          if-no-files-found: error
